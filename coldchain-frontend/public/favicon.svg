<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="24" fill="#0e1a2b"/>
  <!-- Snowflake center -->
  <circle cx="24" cy="24" r="3.5" fill="#06b6d4"/>
  <!-- Snowflake arms -->
  <!-- Top -->
  <line x1="24" y1="24" x2="24" y2="7" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="24" y1="24" x2="24" y2="41" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="24" y1="24" x2="7" y2="24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="24" y1="24" x2="41" y2="24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal top-right -->
  <line x1="24" y1="24" x2="36" y2="12" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal bottom-left -->
  <line x1="24" y1="24" x2="12" y2="36" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal top-left -->
  <line x1="24" y1="24" x2="12" y2="12" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal bottom-right -->
  <line x1="24" y1="24" x2="36" y2="36" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arm tips - top -->
  <line x1="20" y1="11" x2="24" y2="7" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="11" x2="24" y2="7" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm tips - bottom -->
  <line x1="20" y1="37" x2="24" y2="41" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="37" x2="24" y2="41" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm tips - left -->
  <line x1="11" y1="20" x2="7" y2="24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="28" x2="7" y2="24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm tips - right -->
  <line x1="37" y1="20" x2="41" y2="24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="28" x2="41" y2="24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
</svg>